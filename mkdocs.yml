site_name: Society Protocol Docs
theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/Icon-only-Logo-Black.png
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
docs_dir: 'docs'

nav:
  - Home: index.md
  - Concepts:
      - Codebase vs. Instances: concepts/codebase-vs-instances.md
      - Genesis Energy: concepts/genesis-energy.md
      - Accounts & Badges: concepts/badges-and-accounts.md
  - Governance:
      - Overview & SP DAO: governance/overview.md
  - Badges:
      - Overview: badges/overview.md
      - Community Partners: badges/community-partners.md
      - Community & Contributors: badges/community-and-contributors.md
  - SPEC Token:
      - Overview: SPEC-token/overview.md
      - VIP Rooms: SPEC-token/vip-rooms.md
  - Guides:
      - Create Account: guides/create-account.md
      - Create Badge: guides/create-badge.md
      - Create Community: guides/create-community.md
      - Create Community Badge: guides/create-community-badge.md
      - Add Community Members: guides/mint-community-badge.md
  - Technical:
      - Badge IDs: technical/badge-ids.md
      - Smart Contracts: technical/contracts.md

extra_css:
  - stylesheets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.0/css/glightbox.min.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.0/js/glightbox.min.js
  - javascripts/lightbox.js
